name: Sync Raw Signal mirror feed

on:
  schedule:
    - cron: "45 13 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild mirror feed
        run: python3 build_mirror.py --base-url https://rawqubit.github.io/raw-signal-feed/ --out feed.xml
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Sync mirror feed"
            git push
          fi
